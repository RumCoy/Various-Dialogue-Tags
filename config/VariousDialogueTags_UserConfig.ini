; Please make your changes and edits here. Plugin sections here don't merge with VariousDialogueTags_InternalData.ini; each matching plugin section completely replaces the InternalData version.

	; IncludeForms=
	;	Empty field defaults to including all dialogue.
	;	Entries will cause VDT to tag *only* the specified entries.
	; ExcludeForms=
	;	Empty field defaults to nothing being excluded.
	;	Entries will cause VDT to exclude the specified entries.
	; You will need FormIDs for IncludeForms/ExcludeForms.
	;	Please see sasnikol's "FormIDs and You" for general information regarding FormIDs: https://www.nexusmods.com/skyrimspecialedition/articles/6629
	;	However, as an example, VDT accepts all of these FormIDs for Immersive Wenches v1.6 (an ESP, NOT ESL-flagged): 00000D6B, 0x00D6B, 0xD6B

[General]
Enabled=true
GlobalModPluginTags=false
	; Default value is false. By default, only explicitly listed plugins are tagged. When GlobalModPluginTags=true, unlisted plugins use their plugin name as a tag.

; This example will tag all dialogue options from the specified mod:
; [Plugin:ExampleMod.esp]
; Tag=[Example Tag]
; IncludeForms=
; ExcludeForms=
