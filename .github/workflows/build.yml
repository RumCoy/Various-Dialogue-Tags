name: Build Various Dialogue Tags

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
  VCPKG_FEATURE_FLAGS: manifests,registries,binarycaching
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache

jobs:
  build-windows:
    name: Windows / MSVC 2026
    runs-on: windows-2025-vs2026

    steps:
      - name: Check out project
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check out vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ee12231b20c95013c6638d845d04c91559a1d1ff
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.gitmodules', 'lib/commonlibsse-ng/vcpkg.json') }}

      - name: Ensure vcpkg binary cache directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Configure CMake
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: cmake --preset release

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build DLL
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: cmake --build --preset release

      - name: Create mod staging folders
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: |
          $packageSource = "zz. Mod Data - EDIT FILES HERE (Symlinked to MO2)/Data"
          $descriptorSource = Join-Path $packageSource "aaaRumCoy_DESC.ini"
          $userConfigSource = Join-Path $packageSource "SKSE/Plugins/VariousDialogueTags_UserConfig.ini"

          cmake --install build/release --config Release --prefix package/Data
          if (!(Test-Path package/Data/SKSE/Plugins/00_VariousDialogueTags.dll)) {
            throw "Expected packaged DLL was not produced: 00_VariousDialogueTags.dll"
          }
          if (!(Test-Path package/Data/SKSE/Plugins/VariousDialogueTags_InternalData.ini)) {
            throw "Expected internal-data file was not packaged: VariousDialogueTags_InternalData.ini"
          }

          if (!(Test-Path -LiteralPath $descriptorSource)) {
            throw "Expected descriptor file was not found: $descriptorSource"
          }
          Copy-Item -LiteralPath $descriptorSource -Destination package/Data/aaaRumCoy_DESC.ini

          Copy-Item -LiteralPath LICENSE -Destination package/LICENSE
          Copy-Item -LiteralPath COPYING -Destination package/COPYING
          Copy-Item -LiteralPath lib/commonlibsse-ng/EXCEPTIONS.md -Destination package/COMMONLIBSSE-NG-EXCEPTIONS.md
          New-Item -ItemType Directory -Force -Path package/LICENSES | Out-Null
          Copy-Item -LiteralPath build/release/vcpkg_installed/x64-windows-static-md/share/directxmath/copyright -Destination package/LICENSES/DirectXMath.txt
          Copy-Item -LiteralPath build/release/vcpkg_installed/x64-windows-static-md/share/directxtk/copyright -Destination package/LICENSES/DirectXTK.txt
          Copy-Item -LiteralPath build/release/vcpkg_installed/x64-windows-static-md/share/fmt/copyright -Destination package/LICENSES/fmt.txt
          Copy-Item -LiteralPath build/release/vcpkg_installed/x64-windows-static-md/share/rapidcsv/copyright -Destination package/LICENSES/rapidcsv.txt
          Copy-Item -LiteralPath build/release/vcpkg_installed/x64-windows-static-md/share/spdlog/copyright -Destination package/LICENSES/spdlog.txt
          @(
            "Corresponding source: https://github.com/RumCoy/Various-Dialogue-Tags"
            "CommonLibSSE-NG v5.1.0 source: https://github.com/alandtse/CommonLibSSE-NG/tree/v5.1.0"
          ) | Set-Content -Path package/SOURCE.txt

          if (!(Test-Path -LiteralPath $userConfigSource)) {
            throw "Expected user-config template was not found: $userConfigSource"
          }
          New-Item -ItemType Directory -Force -Path user-config-package/Data/SKSE/Plugins | Out-Null
          Copy-Item -LiteralPath $userConfigSource -Destination user-config-package/Data/SKSE/Plugins/VariousDialogueTags_UserConfig.ini

      - name: Upload ready-to-install mod package
        uses: actions/upload-artifact@v6
        with:
          name: Various Dialogue Tags
          path: package/
          if-no-files-found: error

      - name: Upload optional user-config template
        uses: actions/upload-artifact@v6
        with:
          name: Various Dialogue Tags - Config
          path: user-config-package/
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Various Dialogue Tags - Build Diagnostics
          path: |
            build/release/CMakeCache.txt
            build/release/vcpkg-manifest-install.log
            build/release/vcpkg_installed/vcpkg/issue_body.md
          if-no-files-found: ignore
