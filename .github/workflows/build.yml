name: Build Various Dialogue Tags

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths-ignore:
    - 'docs/**'
    - 'README.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
  VCPKG_FEATURE_FLAGS: manifests,registries,binarycaching
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache
  VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}\cmake\vcpkg-triplets
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

jobs:
  build-windows:
    name: Windows / MSVC 2026
    runs-on: windows-2025-vs2026

    steps:
      - name: Check out project
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out dependencies
        shell: pwsh
        run: git submodule update --init --depth 1 --jobs 2 lib/commonlibsse-ng lib/skse-menu-framework

      - name: Get dependency versions
        id: dependency-versions
        shell: pwsh
        run: |
          "commonlibsse=$(git rev-parse HEAD:lib/commonlibsse-ng)" >> $env:GITHUB_OUTPUT
          "openvr=$(git -C lib/commonlibsse-ng rev-parse HEAD:extern/openvr)" >> $env:GITHUB_OUTPUT

          $configuration = Get-Content -Raw -LiteralPath vcpkg-configuration.json | ConvertFrom-Json
          $vcpkg = $configuration.'default-registry'.baseline
          if ($vcpkg -notmatch '^[0-9a-fA-F]{40}$') {
            throw "Expected a 40-character vcpkg baseline in vcpkg-configuration.json"
          }
          "vcpkg=$($vcpkg.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Get runner version
        id: runner-version
        shell: pwsh
        run: |
          $version = $env:ImageVersion
          if ([string]::IsNullOrWhiteSpace($version)) {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
            $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ([string]::IsNullOrWhiteSpace($installationPath)) {
              throw "Visual Studio installation not found"
            }
            $toolsetFile = Join-Path $installationPath "VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt"
            $version = "msvc-" + (Get-Content -Raw -LiteralPath $toolsetFile).Trim()
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg tool
        id: vcpkg-tool-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg
          key: vcpkg-tool-${{ runner.os }}-${{ steps.dependency-versions.outputs.vcpkg }}

      - name: Check out vcpkg
        if: steps.vcpkg-tool-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ${{ steps.dependency-versions.outputs.vcpkg }}
          path: vcpkg
          persist-credentials: false

      - name: Bootstrap vcpkg
        if: steps.vcpkg-tool-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Save vcpkg tool
        if: steps.vcpkg-tool-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vcpkg
          key: ${{ steps.vcpkg-tool-cache.outputs.cache-primary-key }}

      - name: Restore vcpkg installed tree
        id: vcpkg-installed-cache
        uses: actions/cache/restore@v6
        with:
          path: build/release/vcpkg_installed
          key: vcpkg-installed-ninja-release-${{ runner.os }}-${{ steps.runner-version.outputs.version }}-x64-windows-static-md-${{ steps.dependency-versions.outputs.vcpkg }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.gitmodules', 'lib/commonlibsse-ng/vcpkg.json', 'cmake/vcpkg-triplets/x64-windows-static-md.cmake') }}

      - name: Restore vcpkg binary cache
        if: steps.vcpkg-installed-cache.outputs.cache-hit != 'true'
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg-binary-cache
          key: vcpkg-binary-ninja-release-${{ runner.os }}-${{ steps.runner-version.outputs.version }}-x64-windows-static-md-${{ steps.dependency-versions.outputs.vcpkg }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.gitmodules', 'lib/commonlibsse-ng/vcpkg.json', 'cmake/vcpkg-triplets/x64-windows-static-md.cmake') }}

      - name: Ensure vcpkg binary cache directory exists
        if: steps.vcpkg-installed-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Cache CommonLibSSE prebuilt
        id: commonlib-prebuilt-cache
        uses: actions/cache@v6
        with:
          path: build/release/lib/commonlibsse-ng/.prebuilt
          key: commonlibsse-prebuilt-v2-${{ runner.os }}-${{ steps.dependency-versions.outputs.commonlibsse }}
          restore-keys: |
            commonlibsse-prebuilt-${{ runner.os }}-${{ steps.dependency-versions.outputs.commonlibsse }}

      - name: Locate cached CommonLibSSE prebuilt
        id: commonlib-prebuilt
        if: steps.commonlib-prebuilt-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/release/lib/commonlibsse-ng/.prebuilt"
          $bundle = Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName "lib/CommonLibSSE.lib") } |
            Select-Object -First 1
          if ($bundle) {
            "dir=$($bundle.FullName)" >> $env:GITHUB_OUTPUT
          } else {
            "dir=" >> $env:GITHUB_OUTPUT
          }

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Merge and validate layered internal data
        shell: pwsh
        run: |
          $mergedPath = Join-Path $env:GITHUB_WORKSPACE "build/layered-data/VariousDialogueTags_InternalData.ini"
          & ./scripts/Merge-TagLayers.ps1 `
            -Product VDT `
            -BasePath resources/SharedParentList_Base.ini `
            -CuratedPath resources/VariousDialogueTags_Curated.ini `
            -OutputPath $mergedPath

      - name: Configure CMake
        shell: cmd
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
          VCPKG_MANIFEST_INSTALL: ${{ steps.vcpkg-installed-cache.outputs.cache-hit == 'true' && 'OFF' || 'ON' }}
          COMMONLIB_PREBUILT_DIR: ${{ steps.commonlib-prebuilt.outputs.dir }}
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          cmake -S . -B build/release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake" -DVCPKG_MANIFEST_INSTALL=%VCPKG_MANIFEST_INSTALL% -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCOMMONLIB_PREBUILT_DIR="%COMMONLIB_PREBUILT_DIR%" -DVDT_PRECOMPILE_HEADERS=OFF -DVDT_INTERNAL_DATA_PREMERGED_PATH="%GITHUB_WORKSPACE%\build\layered-data\VariousDialogueTags_InternalData.ini"

      - name: Check CommonLibSSE build mode
        id: commonlib-build-mode
        shell: pwsh
        run: |
          $ninja = Get-Content -Raw -LiteralPath build/release/build.ninja
          $prebuilt = $ninja -match '[\\/]\.prebuilt[\\/].*[\\/]lib[\\/]CommonLibSSE\.lib'
          "prebuilt=$($prebuilt.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Trim CommonLibSSE prebuilt cache
        if: steps.commonlib-build-mode.outputs.prebuilt == 'true'
        shell: pwsh
        run: |
          $root = Join-Path $env:GITHUB_WORKSPACE "build/release/lib/commonlibsse-ng/.prebuilt"
          $before = (Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
          Get-ChildItem -LiteralPath $root -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.zip', '.sha256' } |
            Remove-Item -Force
          Get-ChildItem -LiteralPath $root -Directory -ErrorAction SilentlyContinue |
            Where-Object { $_.Name.EndsWith('.x') } |
            Remove-Item -Recurse -Force
          $after = (Get-ChildItem -LiteralPath $root -Recurse -File -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
          "CommonLibSSE prebuilt cache payload: {0:N1} MB -> {1:N1} MB" -f ($before / 1MB), ($after / 1MB)

      - name: Restore CommonLib OpenVR
        if: steps.commonlib-build-mode.outputs.prebuilt != 'true'
        id: openvr-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            lib/commonlibsse-ng/extern/openvr/headers
            lib/commonlibsse-ng/extern/openvr/lib/win64
          key: commonlib-openvr-${{ runner.os }}-${{ steps.dependency-versions.outputs.openvr }}

      - name: Check out CommonLib OpenVR
        if: steps.commonlib-build-mode.outputs.prebuilt != 'true' && steps.openvr-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: git -C lib/commonlibsse-ng submodule update --init --depth 1 extern/openvr

      - name: Save CommonLib OpenVR
        if: steps.commonlib-build-mode.outputs.prebuilt != 'true' && steps.openvr-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            lib/commonlibsse-ng/extern/openvr/headers
            lib/commonlibsse-ng/extern/openvr/lib/win64
          key: ${{ steps.openvr-cache.outputs.cache-primary-key }}

      - name: Save vcpkg binary cache
        if: steps.vcpkg-installed-cache.outputs.cache-hit != 'true' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Save vcpkg installed tree
        if: steps.vcpkg-installed-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/release/vcpkg_installed
          key: ${{ steps.vcpkg-installed-cache.outputs.cache-primary-key }}

      - name: Build DLL
        shell: cmd
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          cmake --build build/release --parallel
          if errorlevel 1 (
            sccache --show-stats
            exit /b 1
          )
          sccache --show-stats

      - name: Create mod staging folders
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: |
          $resourceSource = "resources"
          $internalDataSource = "build/release/VariousDialogueTags_InternalData.ini"
          $descriptorSource = Join-Path $resourceSource "aaaRumCoy_DESC.ini"
          $userConfigSource = Join-Path $resourceSource "VariousDialogueTags_UserConfig.ini"

          cmake --install build/release --prefix package/Data
          if (!(Test-Path package/Data/SKSE/Plugins/00_VariousDialogueTags.dll)) {
            throw "Expected packaged DLL was not produced: 00_VariousDialogueTags.dll"
          }
          $dllBytes = [System.IO.File]::ReadAllBytes(
            "package/Data/SKSE/Plugins/00_VariousDialogueTags.dll")
          $dllText = [System.Text.Encoding]::Latin1.GetString($dllBytes)
          $internalDataMarker = Get-Content -LiteralPath $internalDataSource |
            Where-Object { $_ -match '^\[Plugin:.+\]$' } |
            Select-Object -First 1
          if (!$internalDataMarker) {
            throw "Expected a plugin marker in $internalDataSource"
          }
          if (!$dllText.Contains($internalDataMarker)) {
            throw "Embedded internal-data marker was not found in 00_VariousDialogueTags.dll: $internalDataMarker"
          }
          if (Test-Path package/Data/SKSE/Plugins/VariousDialogueTags_InternalData.ini) {
            throw "Internal data must be embedded in the DLL, not packaged as a separate INI"
          }

          if (!(Test-Path -LiteralPath $descriptorSource)) {
            throw "Expected descriptor file was not found: $descriptorSource"
          }
          Copy-Item -LiteralPath $descriptorSource -Destination package/Data/aaaRumCoy_DESC.ini

          $legalDirectory = "package/Data/Docs/Various Dialogue Tags"
          $legalFile = Join-Path $legalDirectory "LICENSES_AND_SOURCE.txt"
          New-Item -ItemType Directory -Force -Path $legalDirectory | Out-Null

          @(
            "VARIOUS DIALOGUE TAGS"
            "LICENSES AND SOURCE INFORMATION"
            ""
            "Corresponding source code is available from the public repository associated with this release."
          ) | Set-Content -LiteralPath $legalFile -Encoding utf8

          function Add-LicenseSection {
            param([string]$Title, [string]$SourcePath)
            Add-Content -LiteralPath $legalFile -Value @("", "===== $Title =====", "") -Encoding utf8
            Get-Content -Raw -LiteralPath $SourcePath | Add-Content -LiteralPath $legalFile -Encoding utf8
          }

          Add-LicenseSection "Various Dialogue Tags license notice" "LICENSE"
          Add-LicenseSection "GNU General Public License version 3" "COPYING"
          Add-LicenseSection "CommonLibSSE-NG exceptions" "lib/commonlibsse-ng/EXCEPTIONS.md"
          Add-LicenseSection "CommonLibSSE-NG original MIT license" "lib/commonlibsse-ng/licenses/LICENSE-MIT"
          Add-LicenseSection "SKSE Menu Framework LGPL-2.1" "lib/skse-menu-framework/LICENSE"
          Add-LicenseSection "DirectXMath license notices" "build/release/vcpkg_installed/x64-windows-static-md/share/directxmath/copyright"
          Add-LicenseSection "DirectXTK license notices" "build/release/vcpkg_installed/x64-windows-static-md/share/directxtk/copyright"
          Add-LicenseSection "fmt license notices" "build/release/vcpkg_installed/x64-windows-static-md/share/fmt/copyright"
          Add-LicenseSection "rapidcsv license notices" "build/release/vcpkg_installed/x64-windows-static-md/share/rapidcsv/copyright"
          Add-LicenseSection "spdlog license notices" "build/release/vcpkg_installed/x64-windows-static-md/share/spdlog/copyright"

          if (!(Test-Path -LiteralPath $userConfigSource)) {
            throw "Expected user-config template was not found: $userConfigSource"
          }
          New-Item -ItemType Directory -Force -Path user-config-package/Data/SKSE/Plugins | Out-Null
          Copy-Item -LiteralPath $userConfigSource -Destination user-config-package/Data/SKSE/Plugins/VariousDialogueTags_UserConfig.ini

      - name: Upload ready-to-install mod package
        uses: actions/upload-artifact@v6
        with:
          name: Various Dialogue Tags
          path: package/
          if-no-files-found: error

      - name: Upload optional user-config template
        uses: actions/upload-artifact@v6
        with:
          name: Various Dialogue Tags Config
          path: user-config-package/
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Various Dialogue Tags - Build Diagnostics
          path: |
            build/release/CMakeCache.txt
            build/release/vcpkg-manifest-install.log
            build/release/vcpkg_installed/vcpkg/issue_body.md
          if-no-files-found: ignore