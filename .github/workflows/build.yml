name: Build Various Dialogue Tags

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VCPKG_DEFAULT_TRIPLET: x64-windows-static-md
  VCPKG_FEATURE_FLAGS: manifests,registries,binarycaching
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-binary-cache

jobs:
  build-windows:
    name: Windows / MSVC 2026
    runs-on: windows-2025-vs2026

    steps:
      - name: Check out project
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Check out vcpkg
        uses: actions/checkout@v6
        with:
          repository: microsoft/vcpkg
          ref: ee12231b20c95013c6638d845d04c91559a1d1ff
          path: vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: .\vcpkg\bootstrap-vcpkg.bat -disableMetrics

      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.gitmodules', 'lib/commonlibsse-ng/vcpkg.json') }}

      - name: Ensure vcpkg binary cache directory exists
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null

      - name: Merge and validate layered internal data
        shell: pwsh
        run: |
          $mergedPath = Join-Path $env:GITHUB_WORKSPACE "build/layered-data/VariousDialogueTags_InternalData.ini"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/Merge-TagLayers.ps1 `
            -Product VDT `
            -BasePath resources/SharedParentList_Base.ini `
            -EditPath resources/SharedParentList_EditHere.ini `
            -CuratedPath resources/VariousDialogueTags_Curated.ini `
            -OutputPath $mergedPath

      - name: Configure CMake
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: |
          $mergedPath = Join-Path $env:GITHUB_WORKSPACE "build/layered-data/VariousDialogueTags_InternalData.ini"
          cmake --preset release "-DVDT_INTERNAL_DATA_PREMERGED_PATH=$mergedPath"

      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - name: Build DLL
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: cmake --build --preset release

      - name: Create mod staging folders
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ github.workspace }}\vcpkg
        run: |
          $resourceSource = "resources"
          $internalDataSource = "build/release/VariousDialogueTags_InternalData.ini"
          $descriptorSource = Join-Path $resourceSource "aaaRumCoy_DESC.ini"
          $userConfigSource = Join-Path $resourceSource "VariousDialogueTags_UserConfig.ini"

          cmake --install build/release --config Release --prefix package/Data
          if (!(Test-Path package/Data/SKSE/Plugins/00_VariousDialogueTags.dll)) {
            throw "Expected packaged DLL was not produced: 00_VariousDialogueTags.dll"
          }
          $dllBytes = [System.IO.File]::ReadAllBytes(
            "package/Data/SKSE/Plugins/00_VariousDialogueTags.dll")
          $dllText = [System.Text.Encoding]::Latin1.GetString($dllBytes)
          $internalDataMarker = Get-Content -LiteralPath $internalDataSource |
            Where-Object { $_ -match '^\[Plugin:.+\]$' } |
            Select-Object -First 1
          if (!$internalDataMarker) {
            throw "Expected a plugin marker in $internalDataSource"
          }
          if (!$dllText.Contains($internalDataMarker)) {
            throw "Embedded internal-data marker was not found in 00_VariousDialogueTags.dll: $internalDataMarker"
          }
          if (Test-Path package/Data/SKSE/Plugins/VariousDialogueTags_InternalData.ini) {
            throw "Internal data must be embedded in the DLL, not packaged as a separate INI"
          }

          if (!(Test-Path -LiteralPath $descriptorSource)) {
            throw "Expected descriptor file was not found: $descriptorSource"
          }
          Copy-Item -LiteralPath $descriptorSource -Destination package/Data/aaaRumCoy_DESC.ini

          $legalDirectory = "package/Data/Docs/Various Dialogue Tags"
          $legalFile = Join-Path $legalDirectory "LICENSES_AND_SOURCE.txt"
          New-Item -ItemType Directory -Force -Path $legalDirectory | Out-Null

          @(
            "VARIOUS DIALOGUE TAGS"
            "LICENSES AND SOURCE INFORMATION"
            ""
            "Corresponding source code is available from the public repository associated with this release."
          ) | Set-Content -LiteralPath $legalFile -Encoding utf8

          function Add-LicenseSection {
            param([string]$Title, [string]$SourcePath)
            Add-Content -LiteralPath $legalFile -Value @("", "===== $Title =====", "") -Encoding utf8
            Get-Content -Raw -LiteralPath $SourcePath | Add-Content -LiteralPath $legalFile -Encoding utf8
          }

          Add-LicenseSection "Various Dialogue Tags license notice" "LICENSE"
          Add-LicenseSection "GNU General Public License version 3" "COPYING"
          Add-LicenseSection "CommonLibSSE-NG exceptions" "lib/commonlibsse-ng/EXCEPTIONS.md"
          Add-LicenseSection "CommonLibSSE-NG original MIT license" "lib/commonlibsse-ng/LICENSE"
          Add-LicenseSection "DirectXMath license notices" "build/release/vcpkg_installed/x64-windows-static-md/share/directxmath/copyright"
          Add-LicenseSection "DirectXTK license notices" "build/release/vcpkg_installed/x64-windows-static-md/share/directxtk/copyright"
          Add-LicenseSection "fmt license notices" "build/release/vcpkg_installed/x64-windows-static-md/share/fmt/copyright"
          Add-LicenseSection "rapidcsv license notices" "build/release/vcpkg_installed/x64-windows-static-md/share/rapidcsv/copyright"
          Add-LicenseSection "spdlog license notices" "build/release/vcpkg_installed/x64-windows-static-md/share/spdlog/copyright"

          if (!(Test-Path -LiteralPath $userConfigSource)) {
            throw "Expected user-config template was not found: $userConfigSource"
          }
          New-Item -ItemType Directory -Force -Path user-config-package/Data/SKSE/Plugins | Out-Null
          Copy-Item -LiteralPath $userConfigSource -Destination user-config-package/Data/SKSE/Plugins/VariousDialogueTags_UserConfig.ini

      - name: Upload ready-to-install mod package
        uses: actions/upload-artifact@v6
        with:
          name: Various Dialogue Tags
          path: package/
          if-no-files-found: error

      - name: Upload optional user-config template
        uses: actions/upload-artifact@v6
        with:
          name: Various Dialogue Tags Config
          path: user-config-package/
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Various Dialogue Tags - Build Diagnostics
          path: |
            build/release/CMakeCache.txt
            build/release/vcpkg-manifest-install.log
            build/release/vcpkg_installed/vcpkg/issue_body.md
          if-no-files-found: ignore
