; Please make your changes and edits here. Plugin sections here don't merge with VariousDialogueTags_InternalData.ini; each matching plugin section completely replaces the InternalData version.
	; IncludeForms=FormID1,FormID2, FormID3
	;		Line not present, or empty field, defaults to including all dialogue.
	;		Entries will cause VDT to tag *only* the specified entries. Spaces after commas in list are optional.
	; ExcludeForms=FormID1,FormID2, FormID3
	;		Line not present, or empty field, defaults to nothing being excluded.
	;		Entries will cause VDT to exclude the specified entries. Spaces after commas in list are optional.
	; You will need FormIDs for IncludeForms/ExcludeForms.
	;		Please see sasnikol's "FormIDs and You" for general information regarding FormIDs: https://www.nexusmods.com/skyrimspecialedition/articles/6629
	;		However, as an example, VDT accepts all of these FormIDs from Immersive Wenches v1.6 (an ESP, NOT ESL-flagged): 00000D6B, 0x00D6B, 0xD6B

[General]
Enabled=true
GlobalPluginNameFallback=false
; 	GlobalPluginNameFallback will tag every line from every mod, using its plugin name if not explicitly tagged/supported in this INI or in InternalData.

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
;;;;;; Place custom rules below ;;;;;;
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; This complete example will add [FirstTag][SecondTag] tags:
; [Plugin:ExampleMod.esp]
; Tag=[FirstTag][SecondTag]
; IncludeForms=
; ExcludeForms=
;
; COPY THIS ONE FOR SIMPLICITY; this complete example will add [YesThisTagWorks] tags:
[Plugin:ExampleMod.esp]
Tag=YesThisTagWorks

